-heading reveal\"><div class=\"eyebrow\">Informações úteis<\/div><h2>Antes de <em class=\"italic\">começar<\/em><\/h2><\/div><div class=\"faq reveal\"><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>A hospedagem inclui café da manhã?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>O Templo do Ser divulga um café da manhã com ingredientes naturais e opções caseiras. Consulte a equipe para confirmar os detalhes da tarifa e do período desejado.<\/p><\/div><\/div><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>As suítes possuem ar-condicionado e Wi-Fi?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>Sim. A estrutura divulgada inclui ar-condicionado, frigobar, Wi-Fi, água com aquecimento central e varandas com vista para a Mata Atlântica.<\/p><\/div><\/div><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>Posso agendar experiências e terapias?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>O Templo do Ser oferece práticas e terapias; a programação e os serviços disponíveis devem ser confirmados diretamente com a equipe.<\/p><\/div><\/div><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>Como confirmo minha reserva?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>Utilize o formulário de consulta: ele abre o WhatsApp com suas datas e informações. A equipe confirma disponibilidade, valores e condições antes de qualquer reserva.<\/p><\/div><\/div><\/div><\/div><\/section><section class=\"form-section\" id=\"contato\"><div class=\"container form-grid\"><div class=\"reveal\"><div class=\"eyebrow\">Sua próxima pausa começa aqui<\/div><h2>Quando foi a<br/>última vez que<br/><em class=\"italic\">você respirou?<\/em><\/h2><p>Conte quando deseja v ><img alt=\"Espaço externo com piscina e jardim\" class=\"small-photo\" loading=\"lazy\" src=\"https://travelbrazil.co/wp-content/uploads/2021/02/WhatsApp-Image-2021-01-29-at-14.47.22-3-1024x682.jpeg\"/><span class=\"caption-side\">Presença, natureza, transformação<\/span><\/div><\/div><\/section><section class=\"section experience\" id=\"espacos\"><div class=\"container\"><div class=\"center-heading reveal\"><div class=\"eyebrow\">02 / Estrutura que acolhe<\/div><h2>O espaço certo<br/>faz tudo <em class=\"italic\">florescer.<\/em><\/h2><p>Uma estrutura planejada para receber facilitadores e participantes com conforto, flexibilidade e proximidade com a natureza.<\/p><\/div><div class=\"grid-3\"><article class=\"experience-card reveal\"><img alt=\"Hale Luana no Templo do Ser\" loading=\"lazy\" src=\"https://retreathub.com/wp-content/uploads/2024/03/Design-sem-nome-9.png\"/><div class=\"experience-card-content\"><span class=\"count\">01 / 03<\/span><h3>Hale Luana<\/h3><p>Sala de vivências para até 25 pessoas, com recursos para práticas em grupo.<\/p><\/div><\/article><article class=\"experience-card reveal\"><img alt=\"Área externa no Templo do Ser\" loading=\"lazy\" src=\"https://travelbrazil.co/wp-content/uploads/2021/02/WhatsApp-Image-2021-01-29-at-14.47.22-3-1024x682.jpeg\"/><div class=\"experience-card-content\"><span class=\"count\">02 / 03<\/span><h3>Área externa<\/h3><p>Piscina, jacuzzi aquecida e espaços de convivência ao ar livre.<\/p><\/div><\/article><article class=\"experience-card reveal\"><img alt=\"Sabor Do Ser no Templo do Ser\" loading=\"lazy\" src=\"https://www.ilhabela.com.br/wp-content/uploads/2018/04/templo-do-ser-ilhabela.jpeg\"/><div class=\"experience-card-content\"><span class=\"count\">03 / 03<\/span><h3>Sabor Do Ser<\/h3><p>Bistrô com opções vegetarianas, veganas e cardápios adaptáveis.<\/p><\/div><\/article><\/div><\/div><\/section><section class=\"section feature-dark\"><div class=\"container feature-split\"><div class=\"reveal\"><img alt=\"Acomodações e espaços externos iluminados à noite\" class=\"feature-photo\" loading=\"lazy\" src=\"https://retreathub.com/wp-content/uploads/2024/03/12.jpg\"/><\/div><div class=\"reveal\"><span class=\"feature-number\">03<\/span><div class=\"eyebrow\">Tudo em sintonia<\/div><h2>Encontros que<br/>deixam <em class=\"italic\">raízes.<\/em><\/h2><p>Da primeira conversa à experiência em grupo, você conta com o acompanhamento da coordenação de eventos. Um cenário inspirador para yoga, meditação, desenvolvimento humano e imersões.<\/p><div class=\"stat-row\"><div><strong>25<\/strong><span>Pessoas · Hale Luana<\/span><\/div><div><strong>19<\/strong><span>Hóspedes · Hale Moe Moe<\/span><\/div><div><strong>01<\/strong><span>Equipe para apoiar<\/span><\/div><\/div><a class=\"outline\" href=\"#retiros/contato\">Solicitar proposta <span>↗<\/span><\/a><\/div><\/div><\/section><section class=\"section\"><div class=\"container details\"><div class=\"details-left reveal\"><div class=\"eyebrow\">04 / Cada espaço, uma possibilidade<\/div><h2>Detalhes que<br/>fazem a<br/><em class=\"italic\">diferença.<\/em><\/h2><p>Espaços preparados para o encontro entre pessoas, práticas e natureza.<\/p><\/div><div class=\"details-right reveal\"><div class=\"detail-row\"><span class=\"num\">01<\/span><div><strong>Hale Luana · Sala de vivências<\/strong><p>Capacidade para até 25 pessoas, sistema de som, TV, ar-condicionado e acessórios para yoga.<\/p><\/div><\/div><div class=\"detail-row\"><span class=\"num\">02<\/span><div><strong>Hale Moe Moe · Casa de descanso<\/strong><p>Suítes para até 19 participantes, com ar-condicionado, frigobar, Wi-Fi e varanda panorâmica.<\/p><\/div><\/div><div class=\"detail-row\"><span class=\"num\">03<\/span><div><strong>Hale Ola · Casa da Vida<\/strong><p>Ambientes destinados a terapias holísticas, massagens e momentos de autocuidado.<\/p><\/div><\/div><div class=\"detail-row\"><span class=\"num\">04<\/span><div><strong>Hale Nia · Lounge<\/strong><p>Espaço acolhedor para convivência, oficinas e atividades para grupos de até 25 pessoas.<\/p><\/div><\/div><div class=\"detail-row\"><span class=\"num\">05<\/span><div><strong>Sabor Do Ser · Bistro<\/strong><p>Refeições conscientes, com opções vegetarianas, veganas e adaptações alimentares.<\/p><\/div><\/div><div class=\"detail-row\"><span class=\"num\">06<\/span><div><strong>Coordenação dedicada<\/strong><p>Acompanhamento da coordenadora de eventos Cris Heimpel na organização prévia e durante a realização.<\/p><\/div><\/div><\/div><\/div><\/section><section class=\"section experience\"><div class=\"container\"><div class=\"center-heading reveal\"><div class=\"eyebrow\">O processo é simples<\/div><h2>Da intenção à<br/><em class=\"italic\">realização.<\/em><\/h2><\/div><div class=\"steps reveal\"><div class=\"step\"><span class=\"step-num\">01<\/span><h3>Compartilhe sua ideia<\/h3><p>Conte-nos o tipo de retiro, número de participantes e a época desejada.<\/p><\/div><div class=\"step\"><span class=\"step-num\">02<\/span><h3>Desenhe a experiência<\/h3><p>Converse com a coordenação sobre ambientes, alimentação e necessidades do grupo.<\/p><\/div><div class=\"step\"><span class=\"step-num\">03<\/span><h3>Viva o encontro<\/h3><p>Com detalhes alinhados, construa uma vivência especial em meio à natureza.<\/p><\/div><\/div><\/div><\/section><section class=\"section\" id=\"galeria\"><div class=\"container\"><div class=\"center-heading reveal\"><div class=\"eyebrow\">Um lugar para sentir<\/div><h2>Pequenos instantes.<br/><em class=\"italic\">Grandes encontros.<\/em><\/h2><p>A beleza está nos detalhes, nos sons da natureza e nos espaços que convidam à presença.<\/p><\/div><div class=\"gallery reveal\"><button aria-label=\"Ampliar imagem: Sala de vivências\" data-gallery=\"\" type=\"button\"><img alt=\"Sala de vivências\" loading=\"lazy\" src=\"https://retreathub.com/wp-content/uploads/2024/03/Design-sem-nome-9.png\"/><span>Sala de vivências ↗<\/span><\/button><button aria-label=\"Ampliar imagem: Vivência de meditação\" data-gallery=\"\" type=\"button\"><img alt=\"Vivência de meditação\" loading=\"lazy\" src=\"https://retreathub.com/wp-content/uploads/2024/03/Design-sem-nome-3.png\"/><span>Vivência de meditação ↗<\/span><\/button><button aria-label=\"Ampliar imagem: Entardecer no Templo\" data-gallery=\"\" type=\"button\"><img alt=\"Entardecer no Templo\" loading=\"lazy\" src=\"https://retreathub.com/wp-content/uploads/2024/03/12.jpg\"/><span>Entardecer no Templo ↗<\/span><\/button><\/div><\/div><\/section><div aria-hidden=\"true\" aria-label=\"Visualização de fotografia\" class=\"image-lightbox\" role=\"dialog\"><button aria-label=\"Fechar\" class=\"close-light\">×<\/button><img alt=\"\"/><\/div><section class=\"section\"><div class=\"container\"><div class=\"center-heading reveal\"><div class=\"eyebrow\">Informações úteis<\/div><h2>Antes de <em class=\"italic\">começar<\/em><\/h2><\/div><div class=\"faq reveal\"><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>Qual é a capacidade da sala de atividades?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>A Sala Hale Luana é divulgada com capacidade para até 25 pessoas, equipada com ar-condicionado e recursos para yoga, meditação e atividades em grupo.<\/p><\/div><\/div><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>Quantas pessoas podem se hospedar durante o retiro?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>O site oficial informa acomodação para até 19 participantes na Casa de Descanso Hale Moe Moe, além de quarto destinado aos facilitadores. Consulte a equipe para configurar o grupo.<\/p><\/div><\/div><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>É possível adaptar a alimentação para o grupo?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>O Sabor Do Ser Bistro divulga opções ovolactovegetarianas, veganas, sem lactose e sem glúten. As necessidades e condições devem ser combinadas previamente.<\/p><\/div><\/div><div class=\"faq-item\"><button aria-expanded=\"false\" class=\"faq-trigger\" type=\"button\"><span>Existe alguém que acompanha a organização?<\/span><span aria-hidden=\"true\">+<\/span><\/button><div class=\"faq-answer\"><p>Sim. A coordenadora de eventos Cris Heimpel é indicada como responsável pelo apoio antes e durante os retiros. O formulário abre uma conversa diretamente com a equipe.<\/p><\/div><\/div><\/div><\/div><\/section><section class=\"form-section\" id=\"contato\"><div class=\"container form-grid\"><div class=\"reveal\"><div class=\"eyebrow\">Comece uma nova experiência<\/div><h2>O seu próximo<br/>retiro começa<br/><em class=\"italic\">com uma conversa.<\/em><\/h2><p>Compartilhe os detalhes do seu encontro. Enviaremos a solicitação como mensagem pronta à Cris Heimpel, coordenadora de eventos.<\/p><p><a href=\"mailto:eventos@templodoser.org\">eventos@templodoser.org ↗<\/a><\/p><\/div><form class=\"form-card reveal\" data-contact-form=\"retiros\"><h3>Solicite sua proposta<\/h3><p class=\"form-hint\">Atendimento personalizado para facilitadores<\/p><div class=\"fields\"><div class=\"field\"><label for=\"nome\">Seu nome *<\/label><input id=\"nome\" maxlength=\"90\" name=\"nome\" placeholder=\"Seu nome\" required=\"\"/><\/div><div class=\"field\"><label for=\"email\">Seu e-mail *<\/label><input id=\"email\" name=\"email\" placeholder=\"voce@exemplo.com\" required=\"\" type=\"email\"/><\/div><div class=\"field wide\"><label for=\"tipo\">Tipo de retiro *<\/label><select id=\"tipo\" name=\"tipo\" required=\"\"><option disabled=\"\" selected=\"\" value=\"\">Selecione uma modalidade<\/option><option>Yoga e meditação<\/option><option>Autoconhecimento<\/option><option>Bem-estar e terapias<\/option><option>Desenvolvimento humano<\/option><option>Outro formato<\/option><\/select><\/div><div class=\"field\"><label for=\"pessoas\">Participantes previstos *<\/label><input id=\"pessoas\" max=\"999\" min=\"1\" name=\"pessoas\" placeholder=\"Ex.: 18\" required=\"\" type=\"number\"/><\/div><div class=\"field\"><label for=\"periodo\">Período desejado *<\/label><input id=\"periodo\" name=\"periodo\" placeholder=\"Ex.: março de 2027\" required=\"\"/><\/div><div class=\"field wide\"><label for=\"mensagem\">Conte sobre sua ideia<\/label><textarea id=\"mensagem\" name=\"mensagem\" placeholder=\"Duração, programação e necessidades especiais...\"><\/textarea><\/div><\/div><button class=\"button gold form-submit\" type=\"submit\">Falar com a coordenação <span class=\"arr\">↗<\/span><\/button><p class=\"form-disclaimer\">Ao continuar, você abrirá o WhatsApp da coordenação com uma mensagem pronta. Nenhuma informação é salva por este site demonstrativo.<\/p><\/form><\/div><\/section><footer class=\"footer\"><div class=\"container\"><div class=\"footer-upper\"><div><a class=\"logo\" href=\"#inicio\"><span class=\"mark\">✺<\/span><span class=\"brandname\">Templo do Ser<small>Ilhabela · Brasil<\/small><\/span><\/a><p style=\"max-width:300px;margin-top:28px\">Um encontro com a natureza. Um reencontro com você.<\/p><a class=\"map-link\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Av.+Engenho+Velho+185+Ilhabela\" rel=\"noopener\" target=\"_blank\">Av. Engenho Velho, 185 · Ilhabela ↗<\/a><\/div><div class=\"footer-menu\"><a href=\"#hospedagem\">Hospedagem<\/a><a href=\"#retiros\">Retiros &amp; eventos<\/a><a href=\"https://templodoser.org\" rel=\"noopener\" target=\"_blank\">Site oficial ↗<\/a><\/div><\/div><div class=\"footer-lower\"><span>Conceito de landing pages · Demonstração não oficial<\/span><span>Imagens de divulgação de terceiros. Uso comercial sujeito à autorização dos titulares.<\/span><\/div><\/div><\/footer><button aria-label=\"Voltar ao início\" id=\"toTop\">↑<\/button><div class=\"concept\">Projeto conceitual para apresentação · não é o site oficial do Templo do Ser<\/div>"};
let current = '';
let activeObserver = null;
function parseRoute() {
  const raw = decodeURIComponent(location.hash.slice(1));
  const [page, section] = raw.split('/');
  if (!['inicio','hospedagem','retiros'].includes(page)) return {page: 'inicio', section: ''};
  return {page, section: section || ''};
}
function route() {
  const {page,section} = parseRoute();
  if (page !== current) {
    current = page;
    activeObserver?.disconnect();
    document.body.style.overflow = '';
    document.body.className = page === 'inicio' ? '' : 'subpage';
    document.getElementById('site').innerHTML = pages[page];
    document.title = (page === 'hospedagem' ? 'Hospedagem' : page === 'retiros' ? 'Retiros e eventos' : 'Escolha sua experiência')+' | Templo do Ser — Demonstração';
    setupPage();
  }
  requestAnimationFrame(() => {
    if (section) {
      const target=document.getElementById(section);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    } else if(page!=='inicio') window.scrollTo({top:0,behavior:'instant'});
    else window.scrollTo(0,0);
  });
}
function onScroll() {
  const y=window.scrollY;
  const nav=document.querySelector('.nav'),progress=document.querySelector('.progress'),topBtn=document.querySelector('#toTop');
  nav?.classList.toggle('scrolled',y>55);
  if (progress) {const d=document.documentElement;progress.style.width=(100*y/Math.max(1,d.scrollHeight-d.clientHeight))+'%';}
  topBtn?.classList.toggle('show',y>650);
  const img=document.querySelector('.hero-img');
  if(img && y < window.innerHeight*1.5 && !matchMedia('(prefers-reduced-motion: reduce)').matches) img.style.transform=`scale(1.06) translateY(${y*.10}px)`;
}
function setupPage() {
  onScroll();
  const els=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window) {
    activeObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');activeObserver?.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -30px 0px'});
    els.forEach(el=>activeObserver.observe(el));
  } else els.forEach(el=>el.classList.add('visible'));
  const hamburger=document.querySelector('.hamburger');
  hamburger?.addEventListener('click',()=>{
    const m=document.querySelector('.navlinks');if(!m)return;
    const opened=m.classList.toggle('open');
    hamburger.setAttribute('aria-expanded',String(opened));
    hamburger.textContent=opened?'✕':'☰';
    document.body.style.overflow=opened?'hidden':'';
  });
  document.querySelectorAll('.navlinks a').forEach(a=>a.addEventListener('click',()=>{
    document.querySelector('.navlinks')?.classList.remove('open');document.body.style.overflow='';
    if(hamburger){hamburger.textContent='☰';hamburger.setAttribute('aria-expanded','false');}
  }));
  document.querySelectorAll('.faq-trigger').forEach(b=>b.addEventListener('click',()=>{
    const opened=b.getAttribute('aria-expanded')==='true';
    document.querySelectorAll('.faq-trigger').forEach(x=>x.setAttribute('aria-expanded','false'));
    b.setAttribute('aria-expanded',String(!opened));
  }));
  const light=document.querySelector('.image-lightbox');
  const close=()=>{if(light){light.classList.remove('open');light.setAttribute('aria-hidden','true');document.body.style.overflow='';}};
  document.querySelectorAll('[data-gallery]').forEach(b=>b.addEventListener('click',()=>{
    if(!light)return;
    const selected=b.querySelector('img'),large=light.querySelector('img');
    if(!selected||!large)return;
    large.src=selected.src;large.alt=selected.alt;
    light.classList.add('open');light.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  }));
  light?.addEventListener('click',e=>{if(e.target===light)close();});
  document.querySelector('.close-light')?.addEventListener('click',close);
  const form=document.querySelector('[data-contact-form]');
  if(form) form.addEventListener('submit',e=>{
    e.preventDefault();if(!form.reportValidity())return;
    const d=new FormData(form),kind=form.getAttribute('data-contact-form');
    if(kind==='hospedagem' && d.get('saida')<=d.get('entrada')){alert('A data de saída deve ser posterior à data de entrada.');return;}
    const lines=kind==='hospedagem' ? [
      'Olá! Gostaria de consultar disponibilidade de hospedagem no Templo do Ser.','',`Nome: ${d.get('nome')}`,`Chegada: ${d.get('entrada')}`,`Saída: ${d.get('saida')}`,`Hóspedes: ${d.get('pessoas')}`,`Detalhes: ${d.get('mensagem')||'Não informado'}`
    ] : ['Olá, Cris! Gostaria de conversar sobre a realização de um retiro no Templo do Ser.','',`Nome: ${d.get('nome')}`,`E-mail: ${d.get('email')}`,`Tipo de retiro: ${d.get('tipo')}`,`Participantes: ${d.get('pessoas')}`,`Período desejado: ${d.get('periodo')}`,`Detalhes: ${d.get('mensagem')||'Não informado'}`];
    const phone=kind==='hospedagem'?'5512997363846':'5511988920831';
    const url='https://wa.me/'+phone+'?text='+encodeURIComponent(lines.join('\n'));
    const win=window.open(url,'_blank','noopener,noreferrer');
    if(!win){window.location.href=url;}
  });
  const checkin=document.querySelector('[name="entrada"]'),checkout=document.querySelector('[name="saida"]');
  if(checkin&&checkout){
    const today=new Date();const pad=n=>String(n).padStart(2,'0');
    const local=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    checkin.min=local;checkout.min=local;
    checkin.addEventListener('change',()=>{checkout.min=checkin.value||local;if(checkout.value&&checkout.value<=checkin.value)checkout.value='';});
  }
  document.querySelector('#toTop')?.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('hashchange',()=>{
  const r=parseRoute(),raw=location.hash.slice(1);
  if(['inicio','hospedagem','retiros'].includes(raw.split('/')[0])) route();
});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape') {const light=document.querySelector('.image-lightbox');if(light?.classList.contains('open')){light.classList.remove('open');document.body.style.overflow='';}}
});
// Captura cliques em links internos mesmo em visualizadores que suprimem hashchange.
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');if(!a)return;
  const raw=a.getAttribute('href').slice(1);
  if(!['inicio','hospedagem','retiros'].includes(raw.split('/')[0]))return;
  if(location.hash==='#'+raw){e.preventDefault();route();}
});
route();</script></body></html>
